<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт — Главная</title>

  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- Свой CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<body>

  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">Мой сайт</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
      </ul>
    </div>
  </nav>

  <!-- Контент -->
  <div class="container mt-5">
    <h1>Добро пожаловать!</h1>
    <p class="lead">Это главная страница моего сайта.</p>

    <!-- Кнопка, открывающая модалку Bootstrap (демонстрация работы JS-библиотеки) -->
    <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#infoModal">
      Показать модальное окно
    </button>

    <!-- Модальное окно Bootstrap -->
    <div class="modal fade" id="infoModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Модальное окно</h5>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            Это окно работает благодаря Bootstrap JS.
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Закрыть</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== ФОРМА ===== -->
    <h2 class="mt-5">Оформление заказа</h2>
    <form id="orderForm" class="mt-3">
      <div class="form-group">
        <label for="username">Имя</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Введите имя" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль (минимум 6 символов)</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Пароль" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="quantity">Количество товара</label>
        <input type="number" class="form-control" id="quantity" name="quantity" value="1" min="1" required>
      </div>
      <button type="submit" class="btn btn-success">Оформить заказ</button>
    </form>
  </div>

  <!-- Bootstrap 4 JS (jQuery + Popper + Bootstrap) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <!-- НАШ СКРИПТ — последним, после формы -->
  <script src="js/site.js"></script>
</body>
</html>
