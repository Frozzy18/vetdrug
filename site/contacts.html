<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт — Контакты</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Яндекс.Метрика: скопируй сюда тот же код, что в index.html -->
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">Мой сайт</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
        <li class="nav-item active"><a class="nav-link" href="contacts.html">Контакты</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h1>Контакты</h1>
    <p>Напишите нам — и мы ответим.</p>

    <form id="contactForm" class="mt-3">
      <div class="form-group">
        <label for="cname">Имя</label>
        <input type="text" class="form-control" id="cname" name="username" placeholder="Ваше имя" required>
      </div>
      <div class="form-group">
        <label for="cemail">Email</label>
        <input type="email" class="form-control" id="cemail" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="cmessage">Сообщение</label>
        <textarea class="form-control" id="cmessage" name="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-success">Отправить</button>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
