<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Запись на приём — ВетДруг</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
          integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">🐾 ВетДруг</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#services">Услуги</a></li>
                    <li class="nav-item"><a class="nav-link" href="pets.html">Мои питомцы</a></li>
                    <li class="nav-item ml-2"><a class="btn btn-light" href="appointment.html">Записаться</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <h1 class="mb-4 text-center">Запись на приём</h1>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <form class="border rounded p-4 bg-white" onsubmit="alert('Спасибо! Вы записаны.'); return false;">

                        <h4 class="mb-3">Данные владельца</h4>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="ownerName">Имя владельца *</label>
                                <input type="text" class="form-control" id="ownerName" placeholder="Иван Иванов" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phone">Телефон *</label>
                                <input type="tel" class="form-control" id="phone" placeholder="+7 (___) ___-__-__" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="example@mail.ru">
                        </div>

                        <hr>
                        <h4 class="mb-3">Данные питомца</h4>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="petName">Кличка питомца *</label>
                                <input type="text" class="form-control" id="petName" placeholder="Барсик" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="petType">Вид животного *</label>
                                <select class="form-control" id="petType" required>
                                    <option value="">Выберите...</option>
                                    <option>Кошка</option>
                                    <option>Собака</option>
                                    <option>Попугай</option>
                                    <option>Грызун</option>
                                    <option>Другое</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="petAge">Возраст питомца</label>
                                <input type="text" class="form-control" id="petAge" placeholder="3 года">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="service">Услуга *</label>
                                <select class="form-control" id="service" required>
                                    <option value="">Выберите услугу...</option>
                                    <option>Терапия</option>
                                    <option>Вакцинация</option>
                                    <option>Стоматология</option>
                                </select>
                            </div>
                        </div>

                        <hr>
                        <h4 class="mb-3">Дата и время</h4>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="date">Дата приёма *</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="time">Время приёма *</label>
                                <input type="time" class="form-control" id="time" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="comment">Комментарий</label>
                            <textarea class="form-control" id="comment" rows="3"
                                      placeholder="Опишите проблему или пожелания"></textarea>
                        </div>

                        <div class="custom-control custom-checkbox mb-3">
                            <input type="checkbox" class="custom-control-input" id="agree" required>
                            <label class="custom-control-label" for="agree">
                                Согласен на обработку персональных данных
                            </label>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg btn-block">Записаться</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="text-white py-3">
        <div class="container text-center">
            <p class="mb-0">© 2026 ВетДруг. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
            integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
            integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>

</body>
</html>
